<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">GD AI Lab architecture</title>
  <desc id="desc">Two separately initialized Transformers are trained on independent datasets, then validated and connected to the GD Forge build pipeline.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1020"/><stop offset="1" stop-color="#16122a"/></linearGradient>
    <linearGradient id="deco" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8b5cf6"/><stop offset="1" stop-color="#ec4899"/></linearGradient>
    <linearGradient id="core" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#06b6d4"/><stop offset="1" stop-color="#3b82f6"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#020617" flood-opacity="0.55"/></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6Z" fill="#94a3b8"/></marker>
  </defs>
  <rect width="1200" height="700" rx="30" fill="url(#bg)"/>
  <circle cx="1010" cy="75" r="140" fill="#7c3aed" opacity="0.08"/><circle cx="100" cy="635" r="190" fill="#06b6d4" opacity="0.07"/>
  <text x="60" y="66" fill="#e2e8f0" font-family="Inter,Arial,sans-serif" font-size="31" font-weight="700">GD AI Lab</text>
  <text x="60" y="99" fill="#94a3b8" font-family="Inter,Arial,sans-serif" font-size="16">two independent neural networks • random initialization • local inference</text>

  <g filter="url(#shadow)">
    <rect x="60" y="145" width="480" height="165" rx="22" fill="#171b34" stroke="#8b5cf6" stroke-width="2"/>
    <rect x="60" y="145" width="480" height="9" rx="4" fill="url(#deco)"/>
    <text x="88" y="192" fill="#e9d5ff" font-family="Inter,Arial,sans-serif" font-size="25" font-weight="700">decoNET</text>
    <text x="88" y="221" fill="#c4b5fd" font-family="Inter,Arial,sans-serif" font-size="15">decoration specialist</text>
    <text x="88" y="255" fill="#cbd5e1" font-family="Inter,Arial,sans-serif" font-size="15">palette • depth • motifs • glow</text>
    <text x="88" y="278" fill="#cbd5e1" font-family="Inter,Arial,sans-serif" font-size="15">section transitions • readability</text>

    <rect x="660" y="145" width="480" height="165" rx="22" fill="#111f32" stroke="#06b6d4" stroke-width="2"/>
    <rect x="660" y="145" width="480" height="9" rx="4" fill="url(#core)"/>
    <text x="688" y="192" fill="#a5f3fc" font-family="Inter,Arial,sans-serif" font-size="25" font-weight="700">gdCORE</text>
    <text x="688" y="221" fill="#67e8f9" font-family="Inter,Arial,sans-serif" font-size="15">gameplay + systems specialist</text>
    <text x="688" y="255" fill="#cbd5e1" font-family="Inter,Arial,sans-serif" font-size="15">platformers • rooms • mechanics</text>
    <text x="688" y="278" fill="#cbd5e1" font-family="Inter,Arial,sans-serif" font-size="15">title screens • shops • trigger plans</text>
  </g>

  <g stroke="#94a3b8" stroke-width="2" fill="none" marker-end="url(#arrow)">
    <path d="M300 310 V360 H390 V398"/><path d="M900 310 V360 H810 V398"/>
  </g>
  <g filter="url(#shadow)">
    <rect x="235" y="400" width="730" height="100" rx="18" fill="#192335" stroke="#475569" stroke-width="1.5"/>
    <text x="600" y="438" fill="#f1f5f9" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="22" font-weight="700">Dataset + training loop</text>
    <text x="600" y="468" fill="#cbd5e1" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="15">curated examples • loss curves • held-out validation • schema checks</text>
  </g>
  <path d="M600 500 V542" stroke="#94a3b8" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <g filter="url(#shadow)">
    <rect x="235" y="545" width="730" height="95" rx="18" fill="#172b26" stroke="#10b981" stroke-width="1.5"/>
    <text x="600" y="582" fill="#a7f3d0" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="22" font-weight="700">Build + verify</text>
    <text x="600" y="610" fill="#cbd5e1" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="15">verified GD 2.2081 catalog • .gmd serializer • import/play tests</text>
  </g>
  <text x="60" y="672" fill="#64748b" font-family="Inter,Arial,sans-serif" font-size="12">prototype note: starter corpus is synthetic; losses do not prove level quality</text>
</svg>
